name: Build image and update GitOps

# Pull requests run the tests and an image build without publishing.
# A push to main publishes the image to GHCR and pins its digest in narackrock-deploy,
# which Argo CD then rolls out.
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'production-deployment' || format('ci-{0}', github.ref) }}
  # Never interrupt an in-flight production rollout; superseded PR runs may be cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.10.1
        ports:
          - 6379:6379
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run tests
        env:
          # Test-only signing key; src/test/resources/application.properties requires it.
          APP_AUTH_TOKEN_SECRET: ci-only-test-secret-value-at-least-32-characters
        run: ./gradlew test --no-daemon

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/build/Dockerfile
          # The k3s-for-service node is x86_64.
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          # Links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.DEPLOY_REPOSITORY || 'parafara/narackrock-deploy' }}
          ref: ${{ vars.DEPLOY_REF || 'main' }}
          # Write deploy key scoped to the deployment repository only.
          ssh-key: ${{ secrets.NARACKROCK_DEPLOY_KEY }}
          path: deploy

      - name: Update deployment image by digest
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          file=deploy/kubernetes/deployment.yaml
          [[ "${DIGEST}" == sha256:* ]] || { echo "Unexpected digest: '${DIGEST}'"; exit 1; }
          # Exactly one image line for this repository may exist; rewrite only that line so
          # the manifest keeps its comments and layout.
          pattern="^([[:space:]]*image: )${IMAGE//./\\.}[@:][^[:space:]]+$"
          matches="$(grep -cE "${pattern}" "${file}" || true)"
          [[ "${matches}" == 1 ]] || { echo "Expected one ${IMAGE} image line, found ${matches}"; exit 1; }
          sed -i -E "s#${pattern}#\1${IMAGE}@${DIGEST}#" "${file}"
          grep -qF "image: ${IMAGE}@${DIGEST}" "${file}"
          git -C deploy config user.name 'github-actions[bot]'
          git -C deploy config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C deploy add kubernetes/deployment.yaml
          if git -C deploy diff --cached --quiet; then
            echo 'Deployment already references this image digest.'
            exit 0
          fi
          git -C deploy commit -m "chore: deploy narackrock-api ${GITHUB_SHA}"
          git -C deploy push
