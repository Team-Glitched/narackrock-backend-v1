name: adlips-application

services:
  backend:
    image: ${ADLIPS_APP_IMAGE:-adlips-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ADLIPS_APP_ENV_FILE:-application.env}
    environment:
      SERVER_PORT: "8080"
      ADLIPS_UPLOAD_DIR: /var/lib/adlips/storage
    ports:
      - "${ADLIPS_APP_BIND_ADDRESS:-127.0.0.1}:${ADLIPS_APP_PORT:-8080}:8080"
    volumes:
      - ${ADLIPS_STORAGE_PATH:-./storage}:/var/lib/adlips/storage
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - application

networks:
  application:
    name: adlips-application
    driver: bridge
