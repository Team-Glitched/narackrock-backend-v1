spring.application.name=adlips-backend
management.endpoints.web.exposure.include=health
spring.config.import=optional:file:./.env[.properties],optional:file:./.env.local[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.token-secret=${APP_AUTH_TOKEN_SECRET}
app.auth.token-validity-seconds=${APP_AUTH_TOKEN_VALIDITY_SECONDS:900}
app.auth.refresh-token-validity-seconds=${APP_AUTH_REFRESH_TOKEN_VALIDITY_SECONDS:2592000}

app.storage.local-root=${ADLIPS_UPLOAD_DIR:${user.home}/.adlips/uploads}
app.storage.public-base-url=${ADLIPS_PUBLIC_FILE_URL:http://localhost:8080/files}
app.api.public-base-url=${ADLIPS_API_PUBLIC_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=${ADLIPS_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${ADLIPS_MULTIPART_MAX_REQUEST_SIZE:25MB}

app.hti.base-url=${HTI_SERVICE_BASE_URL:http://localhost:8000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:adlips-local}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

app.redis.view-deduplication-window=${REDIS_VIEW_DEDUPLICATION_WINDOW:PT30M}
app.redis.view-sync-enabled=${REDIS_VIEW_SYNC_ENABLED:true}
app.redis.view-sync-interval=${REDIS_VIEW_SYNC_INTERVAL:PT10S}
app.redis.view-sync-initial-delay=${REDIS_VIEW_SYNC_INITIAL_DELAY:PT10S}
app.redis.view-sync-batch-size=${REDIS_VIEW_SYNC_BATCH_SIZE:100}
app.redis.short-reaction-cache-ttl=${REDIS_SHORT_REACTION_CACHE_TTL:PT10M}

app.project.export-processing-enabled=${PROJECT_EXPORT_PROCESSING_ENABLED:true}
app.project.export-processing-interval=${PROJECT_EXPORT_PROCESSING_INTERVAL:PT5S}
app.project.export-processing-initial-delay=${PROJECT_EXPORT_PROCESSING_INITIAL_DELAY:PT5S}
app.project.export-processing-batch-size=${PROJECT_EXPORT_PROCESSING_BATCH_SIZE:5}

app.cors.allowed-origins=${ADLIPS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
app.profile.share-base-url=${ADLIPS_PROFILE_SHARE_URL:http://localhost:8080/users/profiles}
app.shorts.share-base-url=${ADLIPS_SHORTS_SHARE_URL:https://narackrock.com/shorts}
app.posts.share-base-url=${ADLIPS_POST_SHARE_URL:https://narackrock.com/posts}

# Read only by the disabled legacy auth, but SecurityConfig always creates its token bean.
# JWT secret must be at least 32 characters (256 bits) for HS256
jwt.secret=${JWT_SECRET:${APP_AUTH_TOKEN_SECRET}}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Open-source playback links and frontend share route (frontend integration is separate).
app.opensource.playback-ttl-seconds=${ADLIPS_OPENSOURCE_PLAYBACK_TTL_SECONDS:600}
app.opensource.playback-secret=${ADLIPS_OPENSOURCE_PLAYBACK_SECRET:${app.auth.token-secret}}
app.opensource.share-base-url=${ADLIPS_OPENSOURCE_SHARE_URL:http://localhost:5173/opensource}
