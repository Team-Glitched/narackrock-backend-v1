spring.application.name=adlips-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adlips}
spring.datasource.username=${DB_USERNAME:adlips}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT secret must be at least 32 characters (256 bits) for HS256
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

google.client-id=${GOOGLE_CLIENT_ID}
