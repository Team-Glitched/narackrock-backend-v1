spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-key-at-least-32-characters-long!!
jwt.expiration-ms=3600000

google.client-id=test-google-client-id

app.auth.token-secret=${APP_AUTH_TOKEN_SECRET}
app.auth.token-validity-seconds=900
app.auth.refresh-token-validity-seconds=2592000
app.storage.local-root=${java.io.tmpdir}/adlips-test-uploads
app.storage.public-base-url=http://localhost/files
app.api.public-base-url=http://localhost
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.profile.share-base-url=http://localhost/users/profiles
